<!DOCTYPE html>
<html lang="en-Us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="contact us">
    <meta name="author" content="angelica sulub">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="logo of the company">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <div>
                <h1>White Water Rafting</h1>
                <p>White Water Rafting</p>
                <p>Location: Yucatán</p>
                <p>Number: +1 999 999 9999</p>
                <p>Email: info@whitewater.com</p>
            </div>
        </section>

        <section class="contact-about">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d18037.549028775164!2d-89.59859903008798!3d21.026741836997203!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2smx!4v1791075024710!5m2!1ses-419!2smx"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="contact-form">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>
                <div>
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                </div>
                <button type="submit">Get in Touch</button>
            </form>
        </section>

        <section class="adventure">
            <h2>We Are Here To Serve You</h2>

            <figure>
                <img src="images/empleado2.jpg" alt="employed 2 guide">
                <figcaption>Diego Gutierrez - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/empleada1.jpg" alt="employed 1">
                <figcaption>Marisol Ruiz - Safety Manager</figcaption>
            </figure>

            <figure>
                <img src="images/empleado3.jpg" alt="employed 3">
                <figcaption>Alberto Castillo - Trip Coordinator</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 🌊 Splash White Water Rafting 🌊 Angelica Sulub</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.jpg"
                  alt="facebook link to the page, if i had one"></a>
            <a href="https://instagram.com"><img src="images/instagram.jpg"
                  alt="instagram link, directly to the page"></a>
            <a href="https://youtube.com"><img src="images/youtube.jpg"
                  alt="youtube link for the interested people"></a>

        </nav>

    </footer>
</body>

</html>
