<!DOCTYPE html>
<html lang="en-Us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page - Splash White Water Rafting</title>
    <meta name="description" content="principal page of splash white water rafting company">
    <meta name="author" content="angelica sulub">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="logo of the company">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="index_page">
            <img src="images/rafting.jpg" alt="people enjoy the activities">
            <h1>Come with us to White Water Rafting</h1>
        </div>
        <form class="introduction">
            <div class="form-request">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="form-request">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <button type="submit">Get in Touch</button>
        </form>
        <section class="link to trip">
            <h2>Adventure Awaits You!</h2>
            <a href="https://angelicasulub6.github.io/wdd130/wwr/trips.html">Trips</a>

            <div class="purpose">
                <figure>
                    <img src="images/boats.jpg" alt="a lot of boats">
                    <figcaption>Xel-Há</figcaption>
                </figure>

                <figure>
                    <img src="images/materials.jpg" alt="materials for the games">
                    <figcaption>Sunset River Run</figcaption>
                </figure>
            </div>

        </section>
    </main>
    <footer>
        <p>©2026 🌊 Splash White Water Rafting 🌊 Angelica Sulub</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.jpg"
                  alt="facebook link to the page, if i had one"></a>
            <a href="https://instagram.com"><img src="images/instagram.jpg"
                  alt="instagram link, directly to the page"></a>
            <a href="https://youtube.com"><img src="images/youtube.jpg"
                  alt="youtube link for the interested people"></a>

        </nav>

    </footer>
